name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android/ platform folder
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create . --platforms=android --org com.myfamily --project-name gps_tracker
          rm -rf lib test
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml

      - name: Add Firebase config and patch Gradle/manifest
        run: |
          cp config/google-services.json android/app/google-services.json
          python3 scripts/patch_android.py

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Family Locator v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
