name: gps_tracker
description: Family location sharing - raw GPS to Firebase, opens official Google Maps app (no Maps SDK, no API key).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  geolocator: ^13.0.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  flutter_background_service: ^5.0.10
  permission_handler: ^11.3.1
  connectivity_plus: ^7.3.2
  another_telephony: ^0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
